[package]
name = "assetcraft-ui-egui"
description = "egui panels: folders, content grid, preview, metadata. Draws only; logic lives in the engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rfd = { workspace = true }
assetcraft-engine = { workspace = true }
assetcraft-fs = { workspace = true }
assetcraft-probe = { workspace = true }
assetcraft-thumbs = { workspace = true }
assetcraft-watch = { workspace = true }
assetcraft-storyboard = { workspace = true }
craft-ui = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# PNG output for the opt-in CPU screenshot test (already a workspace dependency via thumbs).
image = { workspace = true }

[features]
# HEIF/HEIC thumbnails (HEVC, patent-encumbered): off by default, opt in with `--features heic`.
# The user must still turn on View > Formats > HEIC (`formats.heic`). See assetcraft-thumbs.
heic = ["assetcraft-engine/heic", "assetcraft-thumbs/heic"]
