[package]
name = "assetcraft-engine"
description = "Session, command registry and navigation state. Every action is a command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
assetcraft-fs = { workspace = true }
assetcraft-probe = { workspace = true }
assetcraft-thumbs = { workspace = true }
assetcraft-watch = { workspace = true }
assetcraft-storyboard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
# HEIF/HEIC thumbnails (HEVC, patent-encumbered): off by default, opt in with `--features heic`.
# The user must still turn on View > Formats > HEIC (`formats.heic`). See assetcraft-thumbs.
heic = ["assetcraft-thumbs/heic"]
