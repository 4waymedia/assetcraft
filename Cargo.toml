[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/4waymedia/assetcraft"
publish = false

[workspace.dependencies]
# internal
assetcraft-fs = { path = "crates/fs" }
assetcraft-probe = { path = "crates/probe" }
assetcraft-thumbs = { path = "crates/thumbs" }
assetcraft-watch = { path = "crates/watch" }
assetcraft-engine = { path = "crates/engine" }
assetcraft-ui-egui = { path = "crates/ui-egui" }
assetcraft-mesh = { path = "crates/mesh" }
assetcraft-storyboard = { path = "crates/storyboard" }
assetcraft-audio = { path = "crates/audio" }
assetcraft-playback = { path = "crates/playback" }
# external
# SoundCraft's audio file I/O (MIT OR Apache-2.0; symphonia inside, MPL-2.0 by decision AD1).
# Pinned to SoundCraft 0.7.0, the commit docs/track-analysis.md was written against.
# Audio output (Apache-2.0; RustAudio/cpal), the version SoundCraft 0.7.0 uses. Linked by
# assetcraft-playback, used by the desktop app only. Linux builds need ALSA headers (libasound2-dev).
cpal = "0.16"
soundcraft-audio-io = { git = "https://github.com/storytold/soundcraft", rev = "3a28a657692c1b98b28c276d8f61df9471074f0f" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
siphasher = "1"
# Windows Known Folder API wrapper (MIT OR Apache-2.0, artichoke/known-folders-rs); fs only.
known-folders = "1.4"
# Folder watching (CC0-1.0). Default features keep FSEvents on macOS.
notify = "8.2"
# UI (L6 and apps only; see xtask/src/layers.rs). craft-ui pinned to the rev FilmCraft/PhotoCraft use.
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.36", default-features = false }
# Stage 1 decoders from the sibling apps (MIT OR Apache-2.0), pinned by commit.
# PSD/PSB composite: PhotoCraft 0.9.0 (deps: thiserror, flate2).
photocraft-psd = { git = "https://github.com/storytold/photocraft", rev = "c699e3cda69f4852b43c0b191ab0091aaeff9d6a" }
# Camera raw embedded previews and orientation: LightCraft 0.8.0 (no JPEG XL: default features off).
lightcraft-raw = { git = "https://github.com/storytold/lightcraft", rev = "16dbb90499d3c63a6582fcbba1b2550a6e2da032", default-features = false }
lightcraft-meta = { git = "https://github.com/storytold/lightcraft", rev = "16dbb90499d3c63a6582fcbba1b2550a6e2da032" }
# HEIF/HEIC: LightCraft 0.8.0 over heic-rs (pure Rust). Optional (`heic` feature of thumbs, off by default).
lightcraft-heif = { git = "https://github.com/storytold/lightcraft", rev = "16dbb90499d3c63a6582fcbba1b2550a6e2da032" }
# PDF first-page thumbnails (L2 thumbs). PdfCraft's renderer (hayro + vello_cpu, no UI crates),
# MIT OR Apache-2.0, pinned to the PdfCraft 0.8.0 release.
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }

# PdfCraft renders through vendored, patched hayro/lopdf (hostile-file fixes: nesting caps,
# allocation caps, hang fixes; see PdfCraft vendor/README.md). A git dependency doesn't carry its
# workspace's [patch] table, so the same vendored copies are patched in here from the same rev.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "9931329b9fae0b05373b4dc3ac7c58541f0891a4" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
dbg_macro = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
