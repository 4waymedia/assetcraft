[package]
name = "assetcraft-cli"
description = "AssetCraft headless command line: list, probe, thumb, commands, exec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "assetcraft-cli"
path = "src/main.rs"

[dependencies]
assetcraft-engine = { workspace = true }
assetcraft-fs = { workspace = true }
assetcraft-thumbs = { workspace = true }
image = { workspace = true }
serde_json = { workspace = true }

[features]
# HEIF/HEIC thumbnails (HEVC, patent-encumbered): off by default, opt in with `--features heic`.
# The user must still turn on View > Formats > HEIC (`formats.heic`). See assetcraft-thumbs.
heic = ["assetcraft-engine/heic", "assetcraft-thumbs/heic"]
