[package]
name = "assetcraft"
description = "AssetCraft desktop app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
assetcraft-ui-egui = { workspace = true }
assetcraft-engine = { workspace = true }
assetcraft-cache = { workspace = true }
assetcraft-fs = { workspace = true }
assetcraft-thumbs = { workspace = true }
assetcraft-watch = { workspace = true }
assetcraft-playback = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }

[features]
# HEIF/HEIC thumbnails (HEVC, patent-encumbered): off by default, opt in with `--features heic`.
# The user must still turn on View > Formats > HEIC (`formats.heic`). See assetcraft-thumbs.
heic = ["assetcraft-ui-egui/heic", "assetcraft-engine/heic", "assetcraft-thumbs/heic"]

# Icon + VERSIONINFO for assetcraft.exe (build.rs); only needed when building on Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
